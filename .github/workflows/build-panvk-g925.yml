name: build-panvk-g925

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: aarch64-android-panvk-kbase
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      NDK_VERSION: '27.0.12077973'
      ANDROID_API: '34'
      LIBDRM_VERSION: '2.4.123'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config python3-pip python3-mako \
            python3-yaml python3-attr python3-setuptools gcc g++ \
            glslang-tools
          # Host LLVM + CLang + SPIRV-Tools + SPIRV-LLVM-Translator are needed
          # to build the native mesa_clc / vtn_bindgen2 shader generators that
          # panfrost's libpan (OpenCL source) is compiled with during the cross
          # build. These run on the x86_64 runner only; the target driver does
          # not link LLVM.
          sudo apt-get install -y --no-install-recommends \
            llvm-dev libclang-dev libclang-cpp-dev clang cmake git \
            zlib1g-dev libexpat1-dev libdrm-dev
          python3 -m pip install --user --break-system-packages \
            'meson>=1.4' mako

      - name: Install Android NDK r27
        run: |
          set -euo pipefail
          ndk_root="$RUNNER_TEMP/android-ndk-r27"
          ndk_zip="$RUNNER_TEMP/android-ndk-r27-linux.zip"
          if [ ! -x "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang" ]; then
            echo "downloading NDK r27..."
            curl -fL --retry 3 -o "$ndk_zip" \
              "https://dl.google.com/android/repository/android-ndk-r27-linux.zip"
            echo "downloaded: $(du -h "$ndk_zip" | cut -f1)"
            rm -rf "$ndk_root"
            unzip -q "$ndk_zip" -d "$RUNNER_TEMP"
          fi
          tc="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$tc/bin/aarch64-linux-android34-clang" || {
            echo "error: aarch64-linux-android34-clang missing under $tc/bin" >&2
            ls -l "$tc/bin" 2>&1 | head -40 >&2
            exit 1
          }
          echo "NDK ready: $("$tc/bin/clang" --version | head -1)"
          echo "ANDROID_NDK_HOME=$ndk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_TOOLCHAIN=$tc" >> "$GITHUB_ENV"
          echo "$tc/bin" >> "$GITHUB_PATH"

      - name: Build libdrm for Android aarch64
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/libdrm"
          git clone --depth 1 -b "libdrm-${LIBDRM_VERSION}" \
            https://gitlab.freedesktop.org/mesa/drm.git "$src"
          cd "$src"
          cat > ndk-aarch64.ini <<EOF
          [binaries]
          c = 'aarch64-linux-android${ANDROID_API}-clang'
          cpp = 'aarch64-linux-android${ANDROID_API}-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkgconfig = 'pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF
          meson setup build --cross-file ndk-aarch64.ini --prefix="$RUNNER_TEMP/libdrm-install" \
            --libdir=lib \
            -Dintel=disabled -Dradeon=disabled -Damdgpu=disabled -Dnouveau=disabled \
            -Dvmwgfx=disabled -Dfreedreno=disabled -Dvc4=disabled -Detnaviv=disabled \
            -Dtests=false -Dman-pages=disabled
          ninja -C build
          ninja -C build install
          # Do NOT export the Android libdrm pkg-config path globally: the
          # native host tools (mesa_clc, vtn_bindgen2) must link the host
          # libdrm, otherwise the x86-64 link fails on an aarch64 .so. Only
          # the cross configure step below points at the Android libdrm.
          echo "LIBDRM_ANDROID_PC=$RUNNER_TEMP/libdrm-install/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build host SPIRV-Tools (>= 2024.1) and SPIRV-LLVM-Translator
        run: |
          set -euo pipefail
          # Ubuntu 24.04 ships SPIRV-Tools 2023.1 (too old) and has no
          # LLVMSPIRVLib package, both required by Mesa's CLC. Build pinned
          # releases into a local prefix and expose it via PKG_CONFIG_PATH /
          # CMAKE_PREFIX_PATH for the native (host) configure below.
          prefix="$RUNNER_TEMP/clc-deps"
          # Mesa's CLC needs SPIRV-Tools with SetAllowPtrTypeMismatch
          # (KhronosGroup/SPIRV-Tools#5534), which landed after v2024.3;
          # v2024.4 has it. SPIRV-Headers has no matching tags, so use the
          # exact commit SPIRV-Tools v2024.4 pins in its DEPS file.
          mkdir -p "$RUNNER_TEMP/spirv-headers"
          git -C "$RUNNER_TEMP/spirv-headers" init -q
          git -C "$RUNNER_TEMP/spirv-headers" remote add origin \
            https://github.com/KhronosGroup/SPIRV-Headers.git
          git -C "$RUNNER_TEMP/spirv-headers" fetch -q --depth 1 origin \
            3f17b2af6784bfa2c5aa5dbb8e0e74a607dd8b3b
          git -C "$RUNNER_TEMP/spirv-headers" checkout -q FETCH_HEAD

          mkdir -p "$RUNNER_TEMP/spirv-tools"
          git -C "$RUNNER_TEMP/spirv-tools" init -q
          git -C "$RUNNER_TEMP/spirv-tools" remote add origin \
            https://github.com/KhronosGroup/SPIRV-Tools.git
          git -C "$RUNNER_TEMP/spirv-tools" fetch -q --depth 1 origin tag v2024.4
          git -C "$RUNNER_TEMP/spirv-tools" checkout -q FETCH_HEAD
          cmake -S "$RUNNER_TEMP/spirv-tools" -B "$RUNNER_TEMP/spirv-tools/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DSPIRV-Headers_SOURCE_DIR="$RUNNER_TEMP/spirv-headers" \
            -DSPIRV_SKIP_TESTS=ON -DSPIRV_WERROR=OFF
          cmake --build "$RUNNER_TEMP/spirv-tools/build" -j"$(nproc)"
          cmake --install "$RUNNER_TEMP/spirv-tools/build"

          # SPIRV-LLVM-Translator, pinned to the LLVM major shipped by Ubuntu
          # 24.04 (18) so LLVMSPIRVLib's ABI matches dep_llvm.
          llvm_major="$(llvm-config --version | cut -d. -f1)"
          mkdir -p "$RUNNER_TEMP/spirv-llvm-translator"
          git -C "$RUNNER_TEMP/spirv-llvm-translator" init -q
          git -C "$RUNNER_TEMP/spirv-llvm-translator" remote add origin \
            https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git
          git -C "$RUNNER_TEMP/spirv-llvm-translator" fetch -q --depth 1 origin \
            "llvm_release_${llvm_major}0"
          git -C "$RUNNER_TEMP/spirv-llvm-translator" checkout -q FETCH_HEAD
          cmake -S "$RUNNER_TEMP/spirv-llvm-translator" -B "$RUNNER_TEMP/spirv-llvm-translator/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DLLVM_DIR="$(llvm-config --cmakedir)" \
            -DSPIRV-Headers_SOURCE_DIR="$RUNNER_TEMP/spirv-headers" \
            -DLLVM_SPIRV_BUILD_EXTERNAL=YES \
            -DLLVM_INCLUDE_TESTS=OFF
          cmake --build "$RUNNER_TEMP/spirv-llvm-translator/build" -j"$(nproc)"
          cmake --install "$RUNNER_TEMP/spirv-llvm-translator/build"

          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig:$prefix/lib64/pkgconfig:$prefix/share/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"

      - name: Build host shader generators (mesa_clc, vtn_bindgen2)
        run: |
          set -euo pipefail
          # Use only host pkg-config paths. In particular LIBDRM_ANDROID_PC must
          # not leak in here or the native tools would link an aarch64 libdrm.
          unset PKG_CONFIG_LIBDIR || true
          export PKG_CONFIG_PATH="$RUNNER_TEMP/clc-deps/lib/pkgconfig:$RUNNER_TEMP/clc-deps/lib64/pkgconfig:$RUNNER_TEMP/clc-deps/share/pkgconfig"
          export CMAKE_PREFIX_PATH="$RUNNER_TEMP/clc-deps"
          # Build the driver's internal generators for the host, exactly as a
          # cross build expects: mesa_clc, vtn_bindgen2 and panfrost_compile.
          # panfrost_compile needs panfrost enabled, so turn on the panfrost
          # Vulkan driver here (we only compile the specific tool targets).
          meson setup build-native \
            --buildtype release \
            -Dplatforms= \
            -Dgallium-drivers= \
            -Dvulkan-drivers=panfrost \
            -Dpanfrost-kmds=kbase \
            -Dgallium-rusticl=false \
            -Dmesa-clc=enabled \
            -Dprecomp-compiler=enabled \
            -Dspirv-tools=enabled \
            -Dinstall-mesa-clc=true \
            -Dinstall-precomp-compiler=true \
            -Dbuild-tests=false \
            -Dglx=disabled \
            -Degl=disabled \
            -Dopengl=false \
            -Dgles1=disabled -Dgles2=disabled \
            -Dvalgrind=disabled -Dlibunwind=disabled -Dzstd=disabled
          ninja -C build-native \
            src/compiler/clc/mesa_clc \
            src/compiler/spirv/vtn_bindgen2 \
            src/panfrost/clc/panfrost_compile
          for t in \
            "$PWD/build-native/src/compiler/clc/mesa_clc" \
            "$PWD/build-native/src/compiler/spirv/vtn_bindgen2" \
            "$PWD/build-native/src/panfrost/clc/panfrost_compile"; do
            test -x "$t" || { echo "host tool not built: $t" >&2; exit 1; }
          done
          echo "$PWD/build-native/src/compiler/clc" >> "$GITHUB_PATH"
          echo "$PWD/build-native/src/compiler/spirv" >> "$GITHUB_PATH"
          echo "$PWD/build-native/src/panfrost/clc" >> "$GITHUB_PATH"

      - name: Configure Mesa (cross, using host generators)
        run: |
          set -euo pipefail
          # The target libdrm lives in LIBDRM_ANDROID_PC; make it the only
          # pkg-config source so the cross build resolves dep_libdrm to the
          # Android aarch64 library.
          export PKG_CONFIG_LIBDIR="$LIBDRM_ANDROID_PC"
          export PKG_CONFIG_PATH="$LIBDRM_ANDROID_PC"
          meson setup build-android-aarch64 \
            --cross-file ci/android-aarch64.ini \
            --buildtype release \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=panfrost \
            -Dpanfrost-kmds=kbase \
            -Dpanfrost-rust=false \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgallium-va=disabled \
            -Dvideo-codecs= \
            -Dbuild-tests=false \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dllvm=disabled \
            -Dvalgrind=disabled \
            -Dlibunwind=disabled \
            -Dzstd=disabled

      - name: Compile
        run: ninja -C build-android-aarch64

      - name: Collect artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          find build-android-aarch64 -name 'libvulkan_panfrost.so' \
            -o -name 'libvulkan_panvk*.so' | while read -r so; do
            cp "$so" out/
          done
          ls -l out || true
          ( cd out && for f in *.so; do [ -e "$f" ] && sha256sum "$f"; done ) > out/SHA256SUMS || true

      - name: Upload driver
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panvk-g925-aarch64
          path: out/
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs
          path: build-android-aarch64/meson-logs/
          if-no-files-found: ignore
